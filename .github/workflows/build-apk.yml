name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q SdjRoumko_Mastering_v0.3.0.zip -d project

      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SdjRoumko-Mastering-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
