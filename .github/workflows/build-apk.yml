name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract v0.3.0 project
        run: |
          rm -rf project
          mkdir project
          unzip -q SdjRoumko_Mastering_v0.3.0.zip -d project

      - name: Apply startup stability fixes
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_file = Path("app/src/main/java/com/sdjroumko/mastering/MainActivity.kt")
          text = main_file.read_text()

          text = text.replace(
              "private val eqBands = MasterEngine.defaultBands().toMutableList()",
              "private val eqBands by lazy { MasterEngine.defaultBands().toMutableList() }"
          )

          old = """        binding = ActivityMainBinding.inflate(layoutInflater)
        setContentView(binding.root)
        buildEqUi()
        setupTargets()
"""

          new = """        try {
            binding = ActivityMainBinding.inflate(layoutInflater)
            setContentView(binding.root)
            buildEqUi()
            setupTargets()
        } catch (e: Throwable) {
            android.util.Log.e("SdjRoumko", "Startup crash", e)

            val errorView = android.widget.TextView(this).apply {
                text = "SdjRοumko Mastering\\n\\nSTARTUP ERROR\\n\\n${e.javaClass.name}: ${e.message}\\n\\n${e.stackTraceToString()}"
                textSize = 13f
                setPadding(32, 32, 32, 32)
                setTextIsSelectable(true)
            }

            setContentView(errorView)
            return
        }
"""

          if old not in text:
              raise SystemExit("Startup block was not found")

          main_file.write_text(text.replace(old, new))

          styles = Path("app/src/main/res/values/styles.xml")
          style_text = styles.read_text()

          style_text = style_text.replace(
              'parent="Theme.Material3.DayNight.NoActionBar"',
              'parent="Theme.AppCompat.DayNight.NoActionBar"'
          )

          styles.write_text(style_text)

          gradle_file = Path("app/build.gradle.kts")
          gradle_text = gradle_file.read_text()

          gradle_text = gradle_text.replace(
              "targetSdk = 35",
              "targetSdk = 34"
          )

          gradle_file.write_text(gradle_text)

          print("Startup stability fixes applied successfully.")
          PY

      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SdjRoumko-Mastering-FIXED
          path: project/app/build/outputs/apk/debug/app-debug.apk
